version: '3.8'

services:
  db:
    image: postgres:16
    container_name: my_postgres
    restart: always
    environment:
      POSTGRES_USER: buoybuddy
      POSTGRES_PASSWORD: buoybuddy
      POSTGRES_DB: buoybuddy
    ports:
      - "5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
