spring.application.name=buoybuddy
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.web.resources.static-locations=classpath:/static/dist/

server.port=${PORT:5001}

jwt.secret=${JWT_SECRET}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:unset}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:unset}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
# Where the browser lands after Google login, with #token=... appended. Relative because
# the SPA is served same-origin from Spring in production.
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:/oauth2/redirect}
