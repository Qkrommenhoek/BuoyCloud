AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 256
    Architectures: [arm64]          # arm64 is cheaper per GB-second
    Environment:
      Variables:
        TABLE_NAME: !Ref BuoyTable
        # keep in sync with frontend/src/stations.ts
        STATIONS: "46211,46213,46214,46215,46218,46219,46221,46222,46224,46225,46229,46232,46236,46239,46243,46244,46248,46251,46253,46254,46256,46258,46267,46268,46274,46275,46277,46278"

Resources:
  BuoyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      BillingMode: PROVISIONED
      ProvisionedThroughput: { ReadCapacityUnits: 2, WriteCapacityUnits: 10 }   # free tier covers up to 25
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  NdbcFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ndbcservice/
      Handler: ndbcscript.handler
      Timeout: 180
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref BuoyTable }
      Events:
        Every30Min:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(30 minutes)

  GfsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: gfsservice/
      Handler: gfsscript.handler
      Timeout: 600
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref BuoyTable }
      Events:
        AfterEachCycle:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 4,10,16,22 * * ? *)

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: apiservice/
      Handler: api.handler
      Timeout: 10
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref BuoyTable }
      FunctionUrlConfig:
        AuthType: NONE

  FrontendBucket:
    Type: AWS::S3::Bucket

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100          # cheapest: US/Canada/Europe edges only
        HttpVersion: http2and3
        Origins:
          - Id: s3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            DomainName: !Select [2, !Split ["/", !GetAtt ApiFunctionUrl.FunctionUrl]]
            CustomOriginConfig: { OriginProtocolPolicy: https-only }
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader (Function URLs reject a foreign Host)
            Compress: true
        CustomErrorResponses:
          # S3 returns 403 for unknown paths; serve the SPA so /login etc. work on refresh
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html }

  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-api-cache"
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 300
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          QueryStringsConfig: { QueryStringBehavior: all }
          HeadersConfig: { HeaderBehavior: none }
          CookiesConfig: { CookieBehavior: none }
Outputs:
  ApiUrl:
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  FrontendBucketName:
    Value: !Ref FrontendBucket
  DistributionId:
    Value: !Ref Distribution
  SiteUrl:
    Value: !Sub "https://${Distribution.DomainName}"
